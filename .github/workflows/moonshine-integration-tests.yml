name: Moonshine runtime integration tests

on:
  push:
    paths:
      - "run_archive.py"
      - "archive-format-specification.md"
      - "skills/**"
      - "tests/integration_run_archive_moonshine.py"
      - ".github/workflows/moonshine-integration-tests.yml"
  pull_request:
    paths:
      - "run_archive.py"
      - "archive-format-specification.md"
      - "skills/**"
      - "tests/integration_run_archive_moonshine.py"
      - ".github/workflows/moonshine-integration-tests.yml"

permissions:
  contents: read

env:
  MOONSHINE_COMMIT: af181ed4395ce9901a0e59576fa91c9ec7cfa4c6

jobs:
  moonshine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Creative-Intelligence
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned Moonshine PR 4 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps "git+https://github.com/Charlie-Wang-03/Moonshine.git@${MOONSHINE_COMMIT}"

      - name: Run deterministic Moonshine integration tests
        run: python -m unittest -v tests.integration_run_archive_moonshine
